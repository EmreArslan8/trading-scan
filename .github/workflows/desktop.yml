name: Masaüstü program

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pywebview pyinstaller certifi
      - run: python build.py
      - if: runner.os == 'macOS'
        run: cd dist && zip -qry TVTarayici-mac.zip TVTarayici.app
      - uses: actions/upload-artifact@v4
        with:
          name: TVTarayici-${{ runner.os }}
          path: |
            dist/TVTarayici.exe
            dist/TVTarayici-mac.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            TVTarayici.exe
            TVTarayici-mac.zip
